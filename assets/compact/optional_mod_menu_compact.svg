<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="121" height="40" fill="none" viewBox="0 0 121 40">
  <defs>
    <linearGradient id="badge-bg-compact" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0.000" stop-color="#134bff"/>
      <stop offset="1.000" stop-color="#134bff"/>
    </linearGradient>
    <filter id="badge-text-fx-compact" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset in="SourceAlpha" dx="0" dy="2" result="shadowOffset"/>
      <feGaussianBlur in="shadowOffset" stdDeviation="2" result="shadowBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.85" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="121" height="40" fill="url(#badge-bg-compact)" rx="8"/>
  <rect width="119" height="38" x="1" y="1" stroke="#ffffff" stroke-opacity=".15" stroke-width="2" rx="7"/>
  <image href="data:image/png;base64," xlink:href="data:image/png;base64," x="8" y="7" width="26" height="26" preserveAspectRatio="xMidYMid fit"/>
  <!-- 1-Line Text -->
  <text x="42" y="25" fill="#ffffff"  filter="url(#badge-text-fx-compact)" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" >Mod Menu</text>
</svg>